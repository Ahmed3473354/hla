
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>طمّني</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <meta
        name="theme-color"
        content="#2196f3"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

</head>


<body>


    <!-- ==================================================
         📲 تثبيت التطبيق
    ================================================== -->

    <button
        id="installAppBtn"
        class="install-app-btn"
        type="button"
        hidden
    >
        📲 تثبيت تطبيق طمّني
    </button>



    <main class="app">


        <!-- ==================================================
             🛡️ Header
        ================================================== -->

        <h1>🇵🇸 طمّني</h1>

        <p class="subtitle">
            تطبيق العائلة والسلامة
        </p>



        <!-- ==================================================
             🚀 Setup Screen
        ================================================== -->

        <section id="setupScreen">

            <div class="card">

                <h2>
                    مرحبًا 👋
                </h2>

                <p>
                    سيتم إنشاء رقم مستخدم لك تلقائيًا.
                    لا تحتاج إلى إدخال اسم أو رقم هاتف.
                </p>

                <button
                    id="createUserBtn"
                    type="button"
                >
                    🚀 ابدأ
                </button>

            </div>

        </section>



        <!-- ==================================================
             🏠 Home Screen
        ================================================== -->

        <section
            id="homeScreen"
            class="hidden"
        >


            <!-- ==================================================
                 💬 التواصل
            ================================================== -->

            <div class="card">

                <h2>
                    💬 التواصل
                </h2>

                <button
    id="openChatBtn"
    type="button"
>
    💬 محادثة العائلة
</button>

            </div>



            <!-- ==================================================
                 🆔 User ID
            ================================================== -->

            <div class="card">

                <h3>
                    رقم المستخدم
                </h3>

                <div
                    id="userId"
                    class="number"
                ></div>

            </div>



            <!-- ==================================================
                 👨‍👩‍👧 Family
            ================================================== -->

            <div
                id="familySection"
                class="card"
            >

                <h2>
                    👨‍👩‍👧 العائلة
                </h2>


                <!-- إنشاء عائلة -->

                <button
                    id="createFamilyBtn"
                    type="button"
                >
                    ➕ إنشاء عائلة
                </button>


                <!-- الانضمام إلى عائلة -->

                <button
                    id="joinFamilyBtn"
                    type="button"
                >
                    🔐 الانضمام إلى عائلة
                </button>


                <!-- معلومات العائلة -->

                <div
                    id="familyInfo"
                ></div>



                <!-- ==================================================
                     🔤 حرف التعريف
                ================================================== -->

                <div
                    id="initialSection"
                    class="initial-section hidden"
                >

                    <h3>
                        🔤 حرف التعريف
                    </h3>

                    <p>
                        اكتب أول حرف من اسمك ليسهل على عائلتك معرفتك.
                    </p>


                    <input
                        id="nameInitial"
                        type="text"
                        maxlength="1"
                        placeholder="مثال: أ"
                        autocomplete="off"
                    >


                    <button
                        id="saveInitialBtn"
                        type="button"
                    >
                        💾 حفظ الحرف
                    </button>

                </div>



                <!-- ==================================================
                     👨‍👩‍👧 أعضاء العائلة
                ================================================== -->

                <div
                    id="familyMembers"
                    class="family-members"
                ></div>



                <!-- ==================================================
                     🚪 مغادرة العائلة
                ================================================== -->

                <button
                    id="leaveFamilyBtn"
                    type="button"
                    class="leave-family-btn hidden"
                >
                    🚪 حذف نفسي من المجموعة
                </button>

            </div>



            <!-- ==================================================
                 🟢 حالة الأمان
            ================================================== -->

            <div
                id="safeSection"
                class="card hidden"
            >

                <h2>
                    🟢 حالتك
                </h2>


                <button
                    id="safeBtn"
                    type="button"
                    class="safe-button"
                >
                    🟢 أنا بخير
                </button>


                <p
                    id="safeStatus"
                ></p>

            </div>


        </section>



        <!-- ==================================================
             💬 معلومات المجتمع
        ================================================== -->

        <div class="card">

          <button
    id="communityInfoBtn"
    type="button"
>
    💬 معلومات المجتمع
</button>

        </div>


    </main>



    <!-- ==================================================
         🔥 Firebase / App JavaScript
    ================================================== -->

    <script type="module" src="app.protected.js"></script>


</body>

</html>
